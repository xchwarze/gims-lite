# VBA32 (anti-virus.by), ported from the [VBA32] section of KIMS Scans\AVS.ini.
#
# KIMS field            -> GIMS
#   AVPath              -> [engine] executable_path (relative to the install root)
#   Selected=no         -> [engine] preselect = false
#   ReportPath + /R=    -> not used: result_source = stdout, the console prints the same lines
#   H0..H3 (/HA=0..3)   -> default arguments (= H0) and argument.low|medium|high (= H1..H3)
#   DelimiterLeft1/Right1 -> detection_regex.01/.02 (rewritten for Vba32 3.41: the KIMS delimiters also matched the summary table)
#   DownloadShellexe/UpdateShellexe/Download -> [download]/[update] run scripts\install-vba32.bat with the URL
# Not mapped: ExecuteType=Normal (GIMS captures a combined pipe by default; hide_execution = false runs a command in a visible console);
# Icon: none set, so the GUI shows its default antivirus icon (a PNG icon_path would override it).
[engine]
schema_version = 1
engine_id = vba32
display_name = VBA32
engine_type = antivirus
preselect = false
# Antivirus engines run first (order 0); tools such as RHash use a higher order and run after them.
order = 0
executable_path = engines/vba32/vba32w.exe

[scan]
# The 3.41 manifest asks for administrator (highestAvailable): run it with GIMS's own rights instead of failing to start.
run_as_invoker = true
# Built for scanning one file at a time and reading the console output; Vba32w.exe 3.41 (see /? in Vba32EN.lng):
#   /AF+ /RW+ /AR+          every file, spyware/adware/riskware, inside archives
#   /FC- /FD- /FR- /SD- /SR- /QI- /QS-  never cure, delete, rename or quarantine (GIMS decides about deleting)
#   /MR=0 /BT- /AS=0 /PROCESS_HOSTS-    no memory, boot sector, startup or hosts-file checks: they are not about the file
#   /NC+ /WK-               independent of an installed VBA product; never wait for a key
#   /LNG=EN                 the parser reads the English messages ("<path> : infected <name>")
#   /HA=n                   heuristics: 0 off (default), 1 low, 2 medium, 3 high (4 is paranoia)
# H0: heuristics off. Any profile the engine does not define uses these default arguments.
argument.01 = {target}
argument.02 = /AF+
argument.03 = /RW+
argument.04 = /AR+
argument.05 = /FC-
argument.06 = /FD-
argument.07 = /FR-
argument.08 = /SD-
argument.09 = /SR-
argument.10 = /QI-
argument.11 = /QS-
argument.12 = /MR=0
argument.13 = /BT-
argument.14 = /AS=0
argument.15 = /PROCESS_HOSTS-
argument.16 = /NC+
argument.17 = /WK-
argument.18 = /LNG=EN
argument.19 = /HA=0
# H1
argument.low.01 = {target}
argument.low.02 = /AF+
argument.low.03 = /RW+
argument.low.04 = /AR+
argument.low.05 = /FC-
argument.low.06 = /FD-
argument.low.07 = /FR-
argument.low.08 = /SD-
argument.low.09 = /SR-
argument.low.10 = /QI-
argument.low.11 = /QS-
argument.low.12 = /MR=0
argument.low.13 = /BT-
argument.low.14 = /AS=0
argument.low.15 = /PROCESS_HOSTS-
argument.low.16 = /NC+
argument.low.17 = /WK-
argument.low.18 = /LNG=EN
argument.low.19 = /HA=1
# H2
argument.medium.01 = {target}
argument.medium.02 = /AF+
argument.medium.03 = /RW+
argument.medium.04 = /AR+
argument.medium.05 = /FC-
argument.medium.06 = /FD-
argument.medium.07 = /FR-
argument.medium.08 = /SD-
argument.medium.09 = /SR-
argument.medium.10 = /QI-
argument.medium.11 = /QS-
argument.medium.12 = /MR=0
argument.medium.13 = /BT-
argument.medium.14 = /AS=0
argument.medium.15 = /PROCESS_HOSTS-
argument.medium.16 = /NC+
argument.medium.17 = /WK-
argument.medium.18 = /LNG=EN
argument.medium.19 = /HA=2
# H3
argument.high.01 = {target}
argument.high.02 = /AF+
argument.high.03 = /RW+
argument.high.04 = /AR+
argument.high.05 = /FC-
argument.high.06 = /FD-
argument.high.07 = /FR-
argument.high.08 = /SD-
argument.high.09 = /SR-
argument.high.10 = /QI-
argument.high.11 = /QS-
argument.high.12 = /MR=0
argument.high.13 = /BT-
argument.high.14 = /AS=0
argument.high.15 = /PROCESS_HOSTS-
argument.high.16 = /NC+
argument.high.17 = /WK-
argument.high.18 = /LNG=EN
argument.high.19 = /HA=3

[parser]
parser_type = regex
result_source = stdout
# The console prints the same lines the report file would, so no report file is used.
# Vba32 3.41 prints one line per finding: "<path> : infected <name>" or "<path> : is suspected of <name>"
# (INFECTED_BY_MESSAGE / SUSPICIOUS_OBJECT_MESSAGE in Vba32EN.lng). Anchoring on the path and the colon keeps
# the summary table ("- infected   : 0") from being read as a detection.
detection_regex.01 = (?m)^(?P<file>[^\r\n]+?) : infected (?P<detection>[^\r\n]+?)[ \t]*\r?$
detection_regex.02 = (?m)^(?P<file>[^\r\n]+?) : is suspected of (?P<detection>[^\r\n]+?)[ \t]*\r?$

[download]
download_command.01 = cmd.exe
download_command.02 = /c
download_command.03 = {install_root}\scripts\install-vba32.bat
download_command.04 = https://anti-virus.by/download_files/install/VBA32VISTA/3.41.0/Vba32-Vista-3.41.0-multilanguage.exe
timeout_seconds = 0

[update]
update_command.01 = cmd.exe
update_command.02 = /c
update_command.03 = {install_root}\scripts\install-vba32.bat
update_command.04 = https://anti-virus.by/download_files/install/VBA32VISTA/3.41.0/Vba32-Vista-3.41.0-multilanguage.exe
timeout_seconds = 0
