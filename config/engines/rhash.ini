# RHash (hash calculator), a TOOL engine: it does not judge a file and never counts as a detection.
# It reports INFO about what was scanned: `[parser] info_regex` picks the SHA1 out of rhash's output.
# Options from the official RHash man page: --sha1 (-H), --simple ("<hash>  <file>" per line).
# The KIMS reHash entry used other flags because it was a different tool; they are not ported.
# Want more hashes? Add --crc32, --md5 or --sha256: info_regex keeps only the first 40-hex token (the SHA1).
# Installed to engines/rhash/ (GIMS_ENGINES_DIR, one folder per engine) by scripts\install-rhash.bat.
[engine]
schema_version = 1
engine_id = rhash
display_name = RHash SHA1
engine_type = tool
# Informational tool: off until the user picks it, so it does not run on every scan.
preselect = false
# Runs last (order = 100): it only reports info, so antivirus engines (order 0) go first.
order = 100
executable_path = engines/rhash/rhash.exe

[scan]
argument.01 = --sha1
argument.02 = --simple
argument.03 = {target}
# Hashing is bounded by disk speed; 10 minutes covers multi-GB files, 0 would mean no limit.
timeout_seconds = 600

[parser]
# Matches a SHA1 wherever it sits in the line; word boundaries keep it out of the 32-hex md5 and 64-hex sha256.
info_regex = (?i)\b(?P<info>[0-9a-f]{40})\b

[download]
download_command.01 = cmd.exe
download_command.02 = /c
download_command.03 = {install_root}\scripts\install-rhash.bat
download_command.04 = https://sourceforge.net/projects/rhash/files/latest/download
timeout_seconds = 0

[update]
update_command.01 = cmd.exe
update_command.02 = /c
update_command.03 = {install_root}\scripts\install-rhash.bat
update_command.04 = https://sourceforge.net/projects/rhash/files/latest/download
timeout_seconds = 0
